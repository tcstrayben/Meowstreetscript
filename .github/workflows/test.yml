name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the tests
        run: node --test scripts/merge-stock-data.test.js
      - name: Check the userscript parses
        run: node --check meowstreets-info.user.js
